<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>ShredIntel embed — loader test harness</title>
    <style>
      * { box-sizing: border-box; }
      body { margin: 0; font: 14px/1.5 -apple-system, Segoe UI, Roboto, sans-serif; color: #0f172a; }
      .admin { display: flex; min-height: 100vh; }
      .sidebar { width: 200px; background: #0f172a; color: #cbd5e1; padding: 20px 16px; flex: none; }
      .sidebar h1 { font-size: 13px; letter-spacing: .04em; text-transform: uppercase; color: #64748b; margin: 0 0 16px; }
      .sidebar a { display: block; padding: 8px 10px; border-radius: 6px; color: #cbd5e1; text-decoration: none; font-size: 13px; }
      .sidebar a.active { background: #1e293b; color: #fff; }
      .content { flex: 1; min-width: 0; display: flex; flex-direction: column; }
      .topbar { height: 56px; border-bottom: 1px solid #e2e8f0; display: flex; align-items: center; gap: 8px; padding: 0 20px; background: #fff; }
      .topbar button { font: inherit; padding: 6px 12px; border: 1px solid #cbd5e1; background: #fff; border-radius: 6px; cursor: pointer; }
      .topbar button:hover { background: #f1f5f9; }
      .topbar .route { margin-left: auto; font-family: ui-monospace, Menlo, monospace; font-size: 12px; color: #64748b; }
      /* This <main> is the injection target the loader looks for (mirrors the real admin). */
      main { flex: 1; padding: 24px; }
      .placeholder { color: #94a3b8; border: 2px dashed #e2e8f0; border-radius: 12px; padding: 48px; text-align: center; }
    </style>

    <!-- 1) Host config: point the loader at THIS dev server so the iframe loads
             the local app and height messages are accepted from this origin. -->
    <script>
      window.SHREDINTEL_EMBED = { appOrigin: location.origin }
    </script>

    <!-- 2) Mock the host's session-authed token endpoint. In production BotScrew
             implements GET /api/private/analytics-token?botId=; here we mint an
             UNSIGNED dev JWT with the right shape so the loader + gate light up.
             (No secret — client only decodes; real verification is server-side.) -->
    <script>
      function b64url(obj) {
        return btoa(JSON.stringify(obj)).replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, '')
      }
      function devToken(botId) {
        var now = Math.floor(Date.now() / 1000)
        var header = b64url({ alg: 'HS256', typ: 'JWT' })
        var payload = b64url({ botId: Number(botId), iss: 'botscrew', iat: now, exp: now + 3600 })
        return header + '.' + payload + '.devsignature'
      }
      var _fetch = window.fetch.bind(window)
      window.fetch = function (input, init) {
        var url = typeof input === 'string' ? input : (input && input.url) || ''
        if (url.indexOf('/api/private/analytics-token') >= 0) {
          var m = /botId=(\d+)/.exec(url)
          var id = m ? m[1] : '43'
          return Promise.resolve(
            new Response(JSON.stringify({ token: devToken(id) }), {
              status: 200,
              headers: { 'Content-Type': 'application/json' },
            })
          )
        }
        return _fetch(input, init)
      }
    </script>
  </head>
  <body>
    <div class="admin">
      <aside class="sidebar">
        <h1>Admin (simulated)</h1>
        <a href="#" id="nav-analytics" class="active">Analytics</a>
        <a href="#" id="nav-flows">Flows</a>
        <a href="#" id="nav-knowledge">Knowledge</a>
      </aside>
      <div class="content">
        <div class="topbar">
          <button data-route="/admin/bot/43/analytics">Analytics · bot 43 (JH)</button>
          <button data-route="/admin/bot/2/analytics">Analytics · bot 2 (MC)</button>
          <button data-route="/admin/bot/43/flows">Leave analytics →</button>
          <span class="route" id="route"></span>
        </div>
        <!-- The loader replaces the contents of this <main> with the dashboard iframe. -->
        <main>
          <div class="placeholder">Host analytics content would render here.<br />Click a route above to trigger the loader.</div>
        </main>
      </div>
    </div>

    <!-- 3) The real loader (served from /embed.js). Loads AFTER config + mock. -->
    <script src="/embed.js"></script>

    <script>
      // Simulate SPA navigation: pushState (which the loader wraps) + reflect the route.
      function go(route) {
        history.pushState({}, '', route)
        document.getElementById('route').textContent = location.pathname
      }
      Array.prototype.forEach.call(document.querySelectorAll('.topbar button'), function (b) {
        b.addEventListener('click', function () { go(b.getAttribute('data-route')) })
      })
      document.getElementById('route').textContent = location.pathname
    </script>
  </body>
</html>
